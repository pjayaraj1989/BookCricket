name: CI Pipeline

on:
    push:
        branches:
            - "**"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run the script
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x ./ci/scripts/run.sh
          ./ci/scripts/run.sh $GITHUB_WORKSPACE 20
          ls -la $GITHUB_WORKSPACE/logs/

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          # use a glob relative to the workspace; do not rely on shell env expansion here
          path: logs/**
