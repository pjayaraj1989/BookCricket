name: CI Pipeline

on:
    push:
        branches:
            - "**"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Play a randomized 5-over smoke match
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x ./ci/scripts/run.sh
          # minimal, fast sanity check on every push/MR: teams and venue are
          # picked at random by ReadData()/GetVenue() under autoplay, "fast"
          # skips PlayOver's per-ball sleep so this finishes in seconds. A
          # non-zero exit here (an uncaught exception) fails the job - see
          # the nightly Test-match workflow for a slower, more thorough run.
          ./ci/scripts/run.sh $GITHUB_WORKSPACE 5 fast
          ls -la $GITHUB_WORKSPACE/logs/

      - name: Upload log file
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          # use a glob relative to the workspace; do not rely on shell env expansion here
          path: logs/**
