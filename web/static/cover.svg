<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Futura, 'Avenir Next', 'Trebuchet MS', 'Arial Black', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03100a"/>
      <stop offset="0.55" stop-color="#0a231a"/>
      <stop offset="1" stop-color="#123527"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e7a9"/>
      <stop offset="0.5" stop-color="#f2d16b"/>
      <stop offset="1" stop-color="#c99a35"/>
    </linearGradient>
    <radialGradient id="titleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d16b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2d16b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#f2d16b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f2d16b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldLight" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2b6a48"/>
      <stop offset="1" stop-color="#153826"/>
    </radialGradient>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d59d"/>
      <stop offset="1" stop-color="#c4a96a"/>
    </linearGradient>
    <style>
      .star { animation: twinkle 2.6s ease-in-out infinite; }
      .star.s2 { animation-delay: 0.9s; }
      .star.s3 { animation-delay: 1.7s; }
      .ball-group { animation: bob 3.2s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    </style>
  </defs>

  <!-- night sky -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e6f2ea">
    <circle class="star" cx="90" cy="70" r="1.6"/>
    <circle class="star s2" cx="180" cy="120" r="1.2"/>
    <circle class="star s3" cx="300" cy="55" r="1.4"/>
    <circle class="star s2" cx="540" cy="45" r="1.3"/>
    <circle class="star" cx="700" cy="90" r="1.6"/>
    <circle class="star s3" cx="820" cy="60" r="1.2"/>
    <circle class="star s2" cx="420" cy="90" r="1.1"/>
    <circle class="star" cx="640" cy="140" r="1.1"/>
    <circle class="star s3" cx="120" cy="180" r="1.1"/>
    <circle class="star s2" cx="790" cy="170" r="1.3"/>
  </g>

  <!-- floodlight towers -->
  <g>
    <circle cx="120" cy="120" r="90" fill="url(#lampGlow)"/>
    <rect x="116" y="150" width="8" height="230" fill="#0b1f16"/>
    <rect x="78" y="96" width="84" height="52" rx="10" fill="#0b1f16" stroke="#1e4530" stroke-width="2"/>
    <g fill="#fff6d8">
      <circle cx="98" cy="112" r="6"/><circle cx="120" cy="112" r="6"/><circle cx="142" cy="112" r="6"/>
      <circle cx="98" cy="132" r="6"/><circle cx="120" cy="132" r="6"/><circle cx="142" cy="132" r="6"/>
    </g>
    <circle cx="780" cy="120" r="90" fill="url(#lampGlow)"/>
    <rect x="776" y="150" width="8" height="230" fill="#0b1f16"/>
    <rect x="738" y="96" width="84" height="52" rx="10" fill="#0b1f16" stroke="#1e4530" stroke-width="2"/>
    <g fill="#fff6d8">
      <circle cx="758" cy="112" r="6"/><circle cx="780" cy="112" r="6"/><circle cx="802" cy="112" r="6"/>
      <circle cx="758" cy="132" r="6"/><circle cx="780" cy="132" r="6"/><circle cx="802" cy="132" r="6"/>
    </g>
  </g>

  <!-- stadium stands silhouette -->
  <path d="M -20 420 Q 450 330 920 420 L 920 470 Q 450 390 -20 470 Z" fill="#081a12"/>
  <path d="M -20 460 Q 450 375 920 460 L 920 600 L -20 600 Z" fill="#0b241a"/>

  <!-- field -->
  <ellipse cx="450" cy="610" rx="470" ry="165" fill="url(#fieldLight)"/>
  <ellipse cx="450" cy="610" rx="470" ry="165" fill="none" stroke="#2a6b45" stroke-width="2" stroke-dasharray="3 9" opacity="0.7"/>

  <!-- pitch with stumps -->
  <polygon points="434,492 466,492 474,556 426,556" fill="url(#pitchGrad)"/>
  <line x1="437" y1="502" x2="463" y2="502" stroke="#8a7443" stroke-width="1.5"/>
  <g stroke="#f5f0e1" stroke-width="3.5" stroke-linecap="round">
    <line x1="443" y1="466" x2="442" y2="491"/>
    <line x1="450" y1="464" x2="450" y2="491"/>
    <line x1="457" y1="466" x2="458" y2="491"/>
  </g>
  <g stroke="#f2d16b" stroke-width="2.5" stroke-linecap="round">
    <line x1="443" y1="464" x2="449" y2="463"/>
    <line x1="451" y1="463" x2="457" y2="464"/>
  </g>

  <!-- bat leaning by the pitch -->
  <g transform="translate(345 490) rotate(-24) scale(0.72)">
    <rect x="-6" y="-58" width="12" height="34" rx="5" fill="#7a5a34"/>
    <rect x="-14" y="-26" width="28" height="120" rx="12" fill="#d9b878" stroke="#8a7443" stroke-width="2"/>
    <line x1="0" y1="-16" x2="0" y2="84" stroke="#c4a96a" stroke-width="2"/>
  </g>

  <!-- flying ball with trail -->
  <g class="ball-group">
    <path d="M 470 205 Q 560 170 630 195" fill="none" stroke="#f2d16b" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
    <path d="M 500 215 Q 575 185 632 202" fill="none" stroke="#f2d16b" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M 535 225 Q 590 202 634 210" fill="none" stroke="#f2d16b" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="650" cy="210" r="15" fill="#d64545" stroke="#8f2727" stroke-width="2"/>
    <path d="M 641 199 Q 650 210 641 221" fill="none" stroke="#f5f0e1" stroke-width="1.6"/>
    <path d="M 659 199 Q 650 210 659 221" fill="none" stroke="#f5f0e1" stroke-width="1.6"/>
  </g>

  <!-- title -->
  <ellipse cx="450" cy="290" rx="330" ry="130" fill="url(#titleGlow)"/>
  <text x="450" y="298" text-anchor="middle" font-size="86" font-weight="900" letter-spacing="6" fill="url(#gold)" stroke="#03100a" stroke-width="2" paint-order="stroke">BOOK CRICKET</text>
  <text x="450" y="345" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="10" fill="#9fd4b4">THE CLASSIC CRICKET SIMULATOR</text>

  <!-- footer hint -->
  <text x="450" y="586" text-anchor="middle" font-size="14" letter-spacing="4" fill="#e6f2ea" opacity="0.6">PICK YOUR TEAM  ·  WIN THE TOSS  ·  CHASE GLORY</text>
</svg>
