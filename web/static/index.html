<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookCricket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="introSplash" class="intro-splash" title="Click to skip">
    <img alt="BookCricket - the classic cricket simulator">
  </div>

  <header>
    <h1>🏏 BookCricket</h1>
    <div class="header-right">
      <button id="declareBtn" class="declare-btn" title="Declare the current innings" style="display: none;">🏳️ Declare</button>
      <button id="simulateInningsBtn" class="simulate-innings-btn" title="Fast-forward the rest of this innings" style="display: none;">⏩ Simulate innings</button>
      <span id="status" class="status">connecting…</span>
      <button id="killBtn" class="kill-btn" title="Stop the server" style="display: none;">⏻ Stop Server</button>
    </div>
  </header>

  <div id="simOverlay" class="sim-overlay" aria-hidden="true"></div>
  <div id="triviaPanel" class="trivia-panel" aria-hidden="true"></div>

  <main>
    <div id="log" class="log" aria-live="polite"></div>
    <aside id="scorecard" class="scorecard">
      <div id="liveScorecard">
        <p class="hint">Scorecard will appear after the first over.</p>
      </div>
      <div id="inningsSummaries"></div>
    </aside>
    <aside class="right-rail">
      <div id="runRateGraph" class="run-rate-graph" style="display: none;">
        <h3>Run Rate</h3>
        <div id="runRateLegend" class="run-rate-legend"></div>
        <svg id="runRateSvg" viewBox="0 0 260 150" preserveAspectRatio="none"></svg>
      </div>
      <div id="eventPane" class="event-pane" aria-hidden="true"></div>
    </aside>
  </main>

  <footer id="controls" class="controls">
    <p class="hint">Waiting for the match to start…</p>
  </footer>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
